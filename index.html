<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defense-in-depth: the app's only threat surface is file-derived content
         rendered into the DOM. A strict script-src blocks any injected script
         even if escaping is ever incomplete. The only permitted third-party
         origins are Cloudflare Web Analytics (beacon script + RUM endpoint),
         which Cloudflare Pages injects automatically. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Cave Survey Viewer</title>
    <meta name="google-site-verification" content="yhJBw46UtDk7-YZn_gDqYoYJpHEHPOMHRE065-Nohf4" />
    <!-- Favicons: SVG first so capable browsers render a sharp, scalable icon;
         PNG/ICO fallbacks for older browsers and platform-specific surfaces. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#121a28" />
    <meta name="application-name" content="Cave Survey Viewer" />
    <meta
      name="description"
      content="A web-native 3D viewer for cave survey data. Runs entirely in your browser — nothing is uploaded."
    />
    <!-- Open Graph: gives search engines an explicit site name (otherwise Google
         falls back to the pages.dev domain and labels the result "Cloudflare"). -->
    <meta property="og:site_name" content="Cave Survey Viewer" />
    <meta property="og:title" content="Cave Survey Viewer" />
    <meta
      property="og:description"
      content="A web-native 3D viewer for cave survey data. Runs entirely in your browser — nothing is uploaded."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://caveviewer.pages.dev/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cave Survey Viewer",
        "url": "https://caveviewer.pages.dev/"
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>

      <div id="panel"></div>

      <div id="controls-host"></div>

      <div id="toolbar">
        <button id="btn-info" class="mobile-only" type="button" title="Show survey info">Info</button>
        <button id="btn-layers" class="mobile-only" type="button" title="Show view controls">Layers</button>
        <button id="btn-open" type="button">Open file…</button>
        <button id="btn-example" type="button">Load example cave</button>
        <button id="btn-fit" type="button" title="Fit to view (F)">Fit view</button>
        <button id="btn-snapshot" type="button" title="Download a PNG of the current view">Save PNG</button>
        <button id="btn-measure" type="button" title="Measure between two stations">Measure</button>
        <button
          id="btn-controls"
          type="button"
          title="Toggle what left-drag does"
        >Drag: Pan</button>
        <button id="btn-units" type="button" title="Switch between metric and imperial units">Units: Metric</button>
        <button id="btn-theme" type="button" title="Switch between light and dark theme">Theme: Dark</button>
        <input id="file-input" type="file" accept=".3d,.plt,.lox,.top" hidden />
      </div>

      <div id="drop-overlay">
        <div class="drop-message">Drop a Survex <code>.3d</code>, Compass <code>.plt</code>, Therion <code>.lox</code> or PocketTopo <code>.top</code> file to open</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
